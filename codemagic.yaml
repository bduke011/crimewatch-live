workflows:
  ios-archive:
    name: CrimeWatch signed app and simulator preview
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Scan2Profit
    environment:
      node: 22
      xcode: latest
      ios_signing:
        certificates:
          - scan2profit_appstore
        provisioning_profiles:
          - crimewatch_push_appstore_profile
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Test and bundle iPhone app
        script: npm test && npm run ios:sync
      - name: Run on iPhone simulator
        script: bash mobile/simulator-smoke.sh
      - name: Set build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number 6811481294)
          [[ "$LATEST" =~ ^[0-9]+$ ]] || { echo "Could not read the latest Apple build number"; exit 1; }
          agvtool new-version -all "$((LATEST + 1))"
      - name: Apply signing profile
        script: xcode-project use-profiles
      - name: Build signed iPhone app
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - build/iphone-launch.png
      - build/simulator-compile.log
      - /tmp/xcodebuild_logs/*.log
  ios-simulator:
    name: CrimeWatch iPhone compile check
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Test and bundle iPhone app
        script: npm test && npm run ios:sync
      - name: Compile iPhone app
        script: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build/simulator/Build/Products/Debug-iphonesimulator/*.app
  ios-testflight:
    name: CrimeWatch TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Scan2Profit
    environment:
      node: 22
      xcode: latest
      ios_signing:
        certificates:
          - scan2profit_appstore
        provisioning_profiles:
          - crimewatch_push_appstore_profile
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Test and bundle iPhone app
        script: npm test && npm run ios:sync
      - name: Run on iPhone simulator
        script: bash mobile/simulator-smoke.sh
      - name: Set build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number 6811481294)
          [[ "$LATEST" =~ ^[0-9]+$ ]] || { echo "Could not read the latest Apple build number"; exit 1; }
          agvtool new-version -all "$((LATEST + 1))"
      - name: Apply signing profile
        script: xcode-project use-profiles
      - name: Build signed iPhone app
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - build/iphone-launch.png
      - build/simulator-compile.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
